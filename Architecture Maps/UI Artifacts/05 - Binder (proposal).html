<title>Authors Notes Binder</title>
<style>
  /* Layout: the existing app shell (rail · explorer · editor · dock) — tokens copied from the app's index.css */
  :root{
    --bg:#e7e8ea; --chrome:#dbdde1; --panel:#e1e3e6; --canvas:#e9eaec; --page:#ffffff;
    --ink:#23262b; --dim:#5c616a; --faint:#9aa0a8;
    --border:rgba(0,0,0,.12); --border2:rgba(0,0,0,.06);
    --accent:#3f6790; --accent-soft:rgba(63,103,144,.13); --link:#2f5f88;
    --good:#4f7a2f; --warn:#b0801f; --danger:#c4384a; --sel:rgba(63,103,144,.18); --shadow:0 10px 30px rgba(30,34,40,.14);
    --sans:system-ui,"Segoe UI",Roboto,sans-serif;
    --serif:"Iowan Old Style","Palatino Linotype",Georgia,Cambria,serif;
    --mono:ui-monospace,"Cascadia Code",Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#16171a; --chrome:#202227; --panel:#1e2024; --canvas:#17181b; --page:#23252b;
    --ink:#dfe1e4; --dim:#969ba3; --faint:#63676f;
    --border:rgba(255,255,255,.08); --border2:rgba(255,255,255,.045);
    --accent:#6f8cae; --accent-soft:rgba(111,140,174,.16); --link:#7fa6d0;
    --good:#7bbf6a; --warn:#cf9a3f; --danger:#d05a68; --sel:rgba(111,140,174,.22); --shadow:0 12px 34px rgba(0,0,0,.46); color-scheme:dark;
  }}
  :root[data-theme="gray-light"],:root[data-theme="light"]{
    --bg:#e7e8ea; --chrome:#dbdde1; --panel:#e1e3e6; --canvas:#e9eaec; --page:#ffffff;
    --ink:#23262b; --dim:#5c616a; --faint:#9aa0a8; --border:rgba(0,0,0,.12); --border2:rgba(0,0,0,.06);
    --accent:#3f6790; --accent-soft:rgba(63,103,144,.13); --link:#2f5f88;
    --good:#4f7a2f; --warn:#b0801f; --danger:#c4384a; --sel:rgba(63,103,144,.18); --shadow:0 10px 30px rgba(30,34,40,.14); color-scheme:light;
  }
  :root[data-theme="gray-dark"],:root[data-theme="dark"]{
    --bg:#16171a; --chrome:#202227; --panel:#1e2024; --canvas:#17181b; --page:#23252b;
    --ink:#dfe1e4; --dim:#969ba3; --faint:#63676f; --border:rgba(255,255,255,.08); --border2:rgba(255,255,255,.045);
    --accent:#6f8cae; --accent-soft:rgba(111,140,174,.16); --link:#7fa6d0;
    --good:#7bbf6a; --warn:#cf9a3f; --danger:#d05a68; --sel:rgba(111,140,174,.22); --shadow:0 12px 34px rgba(0,0,0,.46); color-scheme:dark;
  }
  :root[data-theme="warm-dark"]{
    --bg:#14130f; --chrome:#1b1a16; --panel:#1b1a16; --canvas:#17150f; --page:#201f1a;
    --ink:#e7e3da; --dim:#a49f93; --faint:#6f6a5c; --border:rgba(255,255,255,.07); --border2:rgba(255,255,255,.04);
    --accent:#d8a657; --accent-soft:rgba(216,166,87,.16); --link:#86b0d6;
    --good:#86c06a; --warn:#d8a657; --danger:#d05a68; --sel:rgba(216,166,87,.22); --shadow:0 12px 34px rgba(0,0,0,.46); color-scheme:dark;
  }
  :root[data-theme="warm-light"]{
    --bg:#efe8d8; --chrome:#e4dbc6; --panel:#ebe3d1; --canvas:#eae2cf; --page:#fbf7ec;
    --ink:#2c271d; --dim:#766c58; --faint:#a89c81; --border:rgba(44,39,29,.12); --border2:rgba(44,39,29,.06);
    --accent:#a9761f; --accent-soft:rgba(169,118,31,.14); --link:#3a5f80;
    --good:#4f7a2f; --warn:#b0801f; --danger:#c4384a; --sel:rgba(169,118,31,.20); --shadow:0 10px 30px rgba(44,39,29,.14); color-scheme:light;
  }

  *{ box-sizing:border-box; } html,body{ height:100%; margin:0; }
  body{ background:var(--bg); color:var(--ink); overflow:hidden; font-family:var(--sans); font-size:13px; -webkit-font-smoothing:antialiased; }
  button{ font:inherit; color:inherit; }
  input,textarea,select{ font:inherit; color:var(--ink); }
  select option{ background:var(--chrome); color:var(--ink); }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:-2px; }
  *{ scrollbar-width:thin; scrollbar-color:var(--faint) transparent; }
  ::selection{ background:var(--sel); }
  svg.i{ width:15px; height:15px; flex:none; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .app{ height:100%; display:grid; grid-template-rows:34px minmax(0,1fr) 24px; }

  /* ---------- top bar ---------- */
  .topbar{ background:var(--chrome); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; padding:0 8px 0 10px; user-select:none; position:relative; z-index:50; min-width:0; }
  .topleft{ flex:1; display:flex; align-items:center; gap:12px; min-width:0; }
  .brand{ font-weight:650; font-size:12.5px; flex:none; }
  .menu{ display:flex; gap:2px; }
  .menuitem{ position:relative; display:flex; }
  .menu > .menuitem > button{ font-size:12px; color:var(--dim); background:transparent; border:0; cursor:pointer; padding:2px 6px; border-radius:5px; }
  .menu > .menuitem > button:hover, .menu > .menuitem > button.hot{ color:var(--ink); background:var(--accent-soft); }
  .menu > .menuitem > button:disabled{ opacity:.5; cursor:default; background:transparent; }
  .filemenu{ position:absolute; top:calc(100% + 3px); left:0; min-width:190px; background:var(--chrome); border:1px solid var(--border); border-radius:9px; box-shadow:var(--shadow); padding:5px; z-index:60; }
  .filemenu button{ display:flex; align-items:center; gap:4px; width:100%; text-align:left; font-size:12.5px; background:transparent; border:0; border-radius:6px; padding:6px 9px; cursor:pointer; }
  .filemenu button:hover{ background:var(--accent-soft); }
  .filemenu button:disabled{ opacity:.45; cursor:default; background:transparent; }
  .filemenu .ck{ display:inline-block; width:14px; color:var(--accent); }
  .filemenu .kbd{ margin-left:auto; color:var(--faint); font-size:11px; }
  .filemenu-sep{ height:1px; background:var(--border); margin:5px 4px; }
  .searchwrap{ flex:0 1 520px; position:relative; min-width:0; }
  .search{ display:flex; align-items:center; gap:8px; height:23px; padding:0 9px; overflow:hidden; background:var(--bg); border:1px solid var(--border); border-radius:7px; }
  .search:focus-within{ border-color:var(--accent); }
  .search .i{ color:var(--faint); width:13px; height:13px; }
  .crumbs{ display:flex; align-items:center; gap:6px; min-width:0; max-width:80%; overflow:hidden; flex:none; }
  .crumb{ font-size:12px; color:var(--dim); white-space:nowrap; } .crumb.cur{ color:var(--ink); overflow:hidden; text-overflow:ellipsis; }
  .csep{ color:var(--faint); font-size:11px; flex:none; }
  .search input{ flex:1; min-width:40px; background:transparent; border:0; outline:0; font-size:12px; }
  .search input::placeholder{ color:var(--faint); }
  .sresults{ position:absolute; top:28px; left:0; right:0; background:var(--chrome); border:1px solid var(--border); border-radius:9px; box-shadow:var(--shadow); padding:6px; z-index:60; max-height:60vh; overflow-y:auto; }
  .stier{ font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--faint); padding:7px 8px 3px; }
  .sitem{ display:flex; align-items:center; gap:8px; padding:5px 8px; border-radius:6px; font-size:12.5px; cursor:pointer; min-width:0; }
  .sitem:hover,.sitem.hl{ background:var(--accent-soft); }
  .sitem .k{ font-size:10px; color:var(--faint); border:1px solid var(--border); border-radius:4px; padding:0 4px; flex:none; }
  .sitem .m{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .sitem .loc{ margin-left:auto; font-size:11px; color:var(--faint); flex:none; padding-left:8px; }
  .sitem mark{ background:var(--accent-soft); color:inherit; border-radius:2px; }
  .right{ flex:1; display:flex; align-items:center; gap:6px; justify-content:flex-end; min-width:0; }
  .seg{ display:flex; background:var(--bg); border:1px solid var(--border); border-radius:7px; overflow:hidden; flex:none; }
  .seg button{ font-size:11px; padding:2px 8px; background:transparent; color:var(--dim); border:0; cursor:pointer; display:flex; align-items:center; gap:5px; }
  .seg button + button{ border-left:1px solid var(--border2); }
  .seg button:hover{ color:var(--ink); }
  .seg button.on{ background:var(--accent); color:#fff; }
  .theme-sel{ height:23px; background:transparent; color:var(--dim); border:0; border-radius:7px; font-size:11.5px; padding:0 6px; cursor:pointer; }
  .paneltoggle{ width:28px; height:23px; display:grid; place-items:center; background:transparent; border:1px solid var(--border); border-radius:7px; color:var(--dim); cursor:pointer; flex:none; }
  .paneltoggle.on{ color:var(--ink); border-color:var(--accent); }

  /* ---------- body grid ---------- */
  .body{ display:grid; grid-template-columns:52px 300px minmax(0,1fr) 300px; min-height:0; position:relative; }
  .body > *{ min-height:0; min-width:0; overflow:hidden; }
  .body.noside{ grid-template-columns:52px 0 minmax(0,1fr) 300px; }
  .body.nodock{ grid-template-columns:52px 300px minmax(0,1fr) 0; }
  .body.noside.nodock{ grid-template-columns:52px 0 minmax(0,1fr) 0; }
  .rail{ background:var(--chrome); border-right:1px solid var(--border); display:flex; flex-direction:column; align-items:center; padding:8px 0; gap:4px; }
  .ri{ width:40px; height:40px; border-radius:9px; display:grid; place-items:center; cursor:pointer; color:var(--dim); position:relative; background:transparent; border:0; }
  .ri:hover{ background:var(--accent-soft); color:var(--ink); }
  .ri.on{ color:var(--ink); }
  .ri.on::before{ content:""; position:absolute; left:-6px; top:9px; bottom:9px; width:3px; background:var(--accent); border-radius:2px; }
  .ri.off{ opacity:.38; cursor:default; } .ri.off:hover{ background:transparent; color:var(--dim); }
  .ri svg.i{ width:21px; height:21px; } .rail .spacer{ flex:1; }

  /* ---------- explorer ---------- */
  .explorer{ background:var(--panel); border-right:1px solid var(--border); overflow-y:auto !important; padding-bottom:40px; scrollbar-gutter:stable; }
  .sec{ position:relative; }
  .sechead{ position:sticky; top:0; z-index:3; background:var(--panel); display:flex; align-items:center; gap:2px; padding:9px 8px 4px 7px; cursor:pointer; user-select:none;
            font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--dim); font-weight:600; }
  .sechead:hover{ color:var(--ink); }
  .sechead .tw{ width:17px; display:inline-flex; justify-content:center; color:var(--faint); }
  .sechead .tw .i{ width:13px; height:13px; }
  .sechead .ss{ margin-left:auto; text-transform:none; letter-spacing:0; font-weight:400; color:var(--faint); font-size:10.5px; padding-right:4px; }
  .sechead.drop-in{ box-shadow:inset 0 -2px 0 var(--accent); }
  .secbody{ padding-bottom:6px; }
  .node{ display:flex; align-items:center; gap:7px; padding:3px 8px 3px 12px; min-height:24px; cursor:pointer; color:var(--ink); white-space:nowrap; position:relative; outline:none; }
  .node:hover{ background:var(--accent-soft); }
  .node.sel{ background:var(--sel); }
  .node:focus-visible{ box-shadow:inset 0 0 0 1px var(--accent); }
  .node .tw{ width:17px; flex:none; display:inline-flex; align-items:center; justify-content:center; color:var(--dim); align-self:stretch; }
  .node .tw .i{ width:14px; height:14px; }
  .node > .i{ color:var(--dim); }
  .node.arc > .i{ color:var(--accent); }
  .node .lbl{ flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .node.arc .lbl{ font-weight:600; }
  .node .lbl.planned{ color:var(--faint); font-style:italic; }
  .node .tag{ font-size:10px; color:var(--faint); padding-left:6px; flex:none; font-variant-numeric:tabular-nums; }
  .node-actions{ display:inline-flex; align-items:center; gap:1px; flex:none; opacity:0; }
  .node:hover .node-actions,.node:focus-within .node-actions,.sechead:hover .node-actions{ opacity:1; }
  .nodebtn{ width:21px; height:21px; display:grid; place-items:center; background:transparent; border:0; color:var(--dim); cursor:pointer; border-radius:5px; padding:0; }
  .nodebtn:hover{ background:var(--accent-soft); color:var(--ink); }
  .nodebtn .i{ width:14px; height:14px; }
  .node.drop-in{ box-shadow:inset 0 0 0 1px var(--accent); background:var(--accent-soft); }
  .node.drop-before{ box-shadow:inset 0 2px 0 var(--accent); }
  .node.drop-after{ box-shadow:inset 0 -2px 0 var(--accent); }
  .node.dragging{ opacity:.45; }
  .inl{ flex:1; min-width:0; background:var(--bg); border:1px solid var(--accent); border-radius:5px; padding:1px 6px; outline:0; font-size:13px; }
  .inlpre{ color:var(--faint); flex:none; }
  .sd{ width:8px; height:8px; border-radius:50%; flex:none; background:var(--faint); }
  .sd.draft{ background:var(--faint); }
  .sd.revised{ background:var(--accent); }
  .sd.final{ background:var(--good); }
  .sd.planned{ background:transparent; border:1.5px dashed var(--faint); }
  .node .sd{ margin:0 3px; }
  .bookrow{ display:flex; gap:10px; align-items:center; padding:6px 10px 8px 27px; cursor:pointer; outline:none; }
  .bookrow:hover{ background:var(--accent-soft); } .bookrow.sel{ background:var(--sel); }
  .bookthumb{ width:34px; height:50px; border-radius:3px; flex:none; overflow:hidden; border:1px solid var(--border); box-shadow:0 1px 4px rgba(0,0,0,.18); }
  .bookinfo{ min-width:0; flex:1; }
  .booktitle{ font-weight:650; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bookmeta{ font-size:11px; color:var(--dim); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums; }
  .bar{ height:4px; background:var(--border); border-radius:3px; overflow:hidden; margin-top:6px; }
  .bar i{ display:block; height:100%; background:var(--accent); border-radius:3px; }
  .bar.big{ height:6px; }

  /* covers (image or typographic) */
  .tcover{ width:100%; height:100%; background:var(--page); color:var(--ink); display:flex; flex-direction:column; justify-content:space-between; padding:12% 10%; font-family:var(--serif); position:relative; }
  .tcover::before{ content:""; position:absolute; left:10%; right:10%; top:8%; height:2px; background:var(--accent); }
  .tcover .ct{ font-size:26px; line-height:1.1; font-weight:600; text-wrap:balance; margin-top:14%; }
  .tcover .ca{ font-size:12px; color:var(--dim); letter-spacing:.12em; text-transform:uppercase; font-family:var(--sans); }
  .tcover.thumb{ padding:0; justify-content:center; align-items:center; }
  .tcover.thumb::before{ top:5px; left:5px; right:5px; height:1.5px; }
  .tcover.thumb .ct{ font-size:20px; margin:0; }
  .cover-img{ width:100%; height:100%; object-fit:cover; display:block; }

  /* ---------- editor ---------- */
  .editor{ display:flex; flex-direction:column; background:var(--canvas); }
  .tabs{ display:flex; align-items:stretch; background:var(--chrome); border-bottom:1px solid var(--border); overflow-x:auto; overflow-y:hidden; flex:none; scrollbar-width:none; }
  .tab{ display:flex; align-items:center; gap:7px; padding:0 6px 0 12px; height:33px; color:var(--dim); border-right:1px solid var(--border2); cursor:pointer; font-size:12.5px; white-space:nowrap; flex:none; max-width:240px; }
  .tab span{ overflow:hidden; text-overflow:ellipsis; }
  .tab.on{ background:var(--canvas); color:var(--ink); box-shadow:inset 0 2px 0 var(--accent); }
  .tab .i{ width:13px; height:13px; color:var(--faint); }
  .tab .x{ width:18px; height:18px; display:grid; place-items:center; border-radius:4px; background:transparent; border:0; color:var(--faint); cursor:pointer; padding:0; font-size:14px; line-height:1; }
  .tab .x:hover{ background:var(--accent-soft); color:var(--ink); }
  .tabfill{ flex:1; }
  #doc{ flex:1; min-height:0; display:flex; flex-direction:column; }
  .docscroll{ flex:1; min-height:0; overflow-y:auto; scrollbar-gutter:stable; }
  .docwrap{ max-width:780px; margin:0 auto; padding:24px 28px 30vh; }
  .docwrap.wide{ max-width:940px; }
  .crumbline{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--faint); margin-bottom:8px; flex-wrap:wrap; }
  .crumbline a{ color:var(--dim); cursor:pointer; } .crumbline a:hover{ color:var(--link); text-decoration:underline; }
  .h1{ font-size:24px; font-weight:650; letter-spacing:-.01em; margin:0; text-wrap:balance; }
  .dochead{ display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  .counts{ font-size:11.5px; color:var(--faint); font-variant-numeric:tabular-nums; }
  .ptitle{ font-size:26px; font-weight:650; letter-spacing:-.01em; background:transparent; border:0; outline:0; width:100%; padding:2px 0; border-radius:6px; }
  .ptitle:focus{ background:var(--bg); box-shadow:0 0 0 6px var(--bg); }
  .ptitle::placeholder,.psummary::placeholder{ color:var(--faint); }
  .psummary{ font-size:14px; color:var(--dim); background:transparent; border:0; outline:0; width:100%; padding:3px 0; margin-top:2px; border-radius:6px; }
  .psummary:focus{ background:var(--bg); box-shadow:0 0 0 6px var(--bg); color:var(--ink); }
  .field{ margin-bottom:14px; min-width:0; }
  .field > label,.flabel{ display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--dim); margin:2px 3px 6px; font-weight:500; }
  .fbox{ background:var(--bg); border:1px solid var(--border2); border-radius:9px; padding:8px 10px; font-size:12.5px; line-height:1.5; width:100%; resize:none; outline:none; display:block; }
  .fbox:focus{ border-color:var(--accent); }
  .fbox::placeholder{ color:var(--faint); }
  select.fbox{ padding:6px 8px; cursor:pointer; }
  .autogrow,#dock textarea.fbox{ overflow:hidden; }
  .grid2{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0 12px; }
  .grid3{ display:grid; grid-template-columns:minmax(0,2fr) 80px minmax(0,2fr); gap:0 12px; }
  .btn{ display:inline-flex; align-items:center; gap:5px; font-size:12px; color:var(--ink); background:transparent; border:1px solid var(--border); border-radius:7px; padding:4px 10px; cursor:pointer; white-space:nowrap; }
  .btn:hover{ background:var(--accent-soft); border-color:var(--accent); }
  .btn:disabled{ opacity:.45; cursor:default; background:transparent; border-color:var(--border); }
  .btn.danger{ color:var(--danger); } .btn.danger:hover{ background:color-mix(in srgb, var(--danger) 14%, transparent); border-color:var(--danger); }
  .btn .i{ width:13px; height:13px; }
  .linkbtn{ background:transparent; border:0; color:var(--link); cursor:pointer; font-size:12px; padding:0; }
  .linkbtn:hover{ text-decoration:underline; }
  .chips{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .chip{ display:inline-flex; align-items:center; gap:4px; font-size:12px; padding:3px 4px 3px 10px; border-radius:999px; background:var(--bg); border:1px solid var(--border); cursor:default; }
  .chip.pick{ cursor:pointer; } .chip.pick:hover{ border-color:var(--accent); }
  .chip.on{ border-color:var(--accent); background:var(--accent-soft); }
  .chip.on .i{ color:var(--accent); }
  .chip .i{ width:12px; height:12px; }
  .chip .cx{ width:17px; height:17px; display:grid; place-items:center; border-radius:50%; background:transparent; border:0; color:var(--faint); cursor:pointer; padding:0; font-size:13px; line-height:1; }
  .chip .cx:hover{ background:var(--accent-soft); color:var(--ink); }
  .chip.toggle{ padding:3px 10px; cursor:pointer; color:var(--dim); }
  .chip.toggle.on{ color:var(--ink); }
  .chipin{ width:130px; font-size:12px; padding:3px 10px; border-radius:999px; border:1px dashed var(--border); background:transparent; outline:0; }
  .chipin:focus{ border-style:solid; border-color:var(--accent); background:var(--bg); }
  .chipin::placeholder{ color:var(--faint); }

  /* page sheets (shared by chapters and every page body) */
  .canvaswrap{ padding:26px 0 40vh; display:flex; flex-direction:column; align-items:center; position:relative; }
  .sheet{ width:var(--sheet-width,620px); max-width:calc(100% - 32px); background:var(--page); box-shadow:var(--shadow); border:1px solid var(--border2); border-radius:2px; padding:66px 74px; position:relative; }
  .sheet.slim{ width:100%; max-width:100%; padding:30px 40px; margin-top:6px; }
  .editor.scroll .canvaswrap .sheet{ width:44rem; box-shadow:none; border:0; background:transparent; padding:0 24px; }
  .chapline{ color:var(--faint); font-size:12px; font-family:var(--mono); }
  .chaptitle-in{ font-family:var(--serif); font-size:28px; font-weight:600; letter-spacing:-.01em; margin:5px 0 22px; background:transparent; border:0; outline:0; width:100%; padding:0; }
  .chaptitle-in::placeholder{ color:var(--faint); }
  .prosearea{ display:block; width:100%; min-height:240px; background:transparent; border:0; outline:0; resize:none; padding:0; font-family:var(--serif); font-size:17px; line-height:1.72; overflow:hidden; }
  .prosearea::placeholder{ color:var(--faint); }
  .sheet.slim .prosearea{ font-size:16px; line-height:1.68; min-height:120px; }
  .excerpt-note{ margin-top:18px; padding-top:10px; border-top:1px dashed var(--border); font-family:var(--sans); font-size:11.5px; color:var(--faint); }

<script>
const CH = [[1,"Thoughts",0,"revised","Qin Peizhi","Qin Peizhi learns his prisoners escaped with the auction goods. He toys with his terrified manager ShouShan, then reveals he already holds the World Revealing Stone.","Establish Qin as ruthless & ahead of everyone; seed the Stone and the pursuit that drives Act 1.",1786,"\"So they escaped after all...\"\n\nThese words were spoken very lightly. Standing up from his wooden desk, the man made his way to the arched window behind him. It held a certain beauty, one that he apreciated greatly.\n\nUnderneath his gaze, people could be seen moving to and from places, some faster than others but never lingering within his sights for long.\n\nHe was Qin Peizhi, city lord of Extreme Path City.\n\nHe looked hard at the outdoors before sighing. His loosely hanging sleeves whipped behind him quickly, his palms slamming hard into his desk.\n\n\"After chasing those damn rats for years, I've finally trapped them in my greatest scheme! But not only are you telling me they escaped from certain imprisonment, they also took those important possessions as well!?\""],[2,"Forced",0,"revised","Qin Peizhi","","",1920,"An arrow began to spin before turning into a deluge of waves. The arrow could no longer be seen clearly and myriad ripples appeared on a stone's surface. They grew weaker in intensity before finally disapearing altogethor. The stone appeared no different from any other rock.\n\n\"Big sis, is this it?\"\n\nThe shortest of three hooded figures called out in a small and soft voice. The eyes hidden beneath a black cloak had been intensely watching a stone in its hands.\n\nThe largest of the three nodded, \"This is the spot!\"\n\nThe Biggest of the three stuck a double edged sword in the mud and picked a fallen log to rest on. Having come this far, she was rather confident, but she had not forgotten their recent capture."],[3,"Demise",0,"revised","Qin Peizhi","","",3065,"\"B-b-big sis ther-\"\n\n\"Dodge!\"\n\nA paw filled with long, sharp claws struck accurately into the smallest figure's back. Tearing through the cloak and into flesh, five daggers dug deep enough to tear into bone.\n\n\"Ahh! keugh, he..lp..m..e...\" A voice yelled out but was muffled as a six foot tall panther-like beast was now hunched over the body as it stood gaurd, pressing its body weight further against its prey.\n\n\"Little Mei!\" The tallest of the hooded three called out, her voice filled with grief. She wanted nothing more than to tear this wild beast to shreds.\n\nSeperate figures dashed directly at the big cat, A series of sword strikes lashed out but landed amongst the air."],[4,"Awareness",0,"revised","Qin Peizhi","","",2174,"Clang!\n\nTwo Swords were deadlocked in position, They had been fighting for the greater part of an hour with neither side giving way to the other. The ground was littered in markings of the sword and palm, some even went a meter deep.\n\n\"mid-rank foundation establishment, is this all that you amount to after becoming a devil cultivator? I was told someone of note would be tracking these few.\"\n\nQin Peizhi voice was calm and collected. he was not too overbearing in his manner of speech, but his opponent seemed to be infuriated by his words.\n\n\"Humph, you jest! What does someone like you understand?\"\n\nThe man had long since stopped smiling and his black eyes grew darker. His veins began to swell while his skin turned a turbid color. Even the blood beneath began to boil, turning black as well."],[5,"People",0,"draft","Qin Peizhi","","",2955,"Outside a particular room, was a courtyard with a variety of flowers. There were a few tough looking men standing around, each briming with power and sporting hard faces. No one would dare aproach with them outside of it. Even the servants found it hard moving around, shivering at the thought of bringing more food to the room.\n\n\"Its been a pleasure speaking with you, ShouShan! ha-ha, then as you said, I'll go with that!\"\n\nInside the room, a cheery voice was relishing many kinds of fine wine and meat. On the small table between two people, was specially prepared cuts of nearly every native animal. For the young master Lei, the most delicious food by far, was the benefits he had gained."],[6,"Voices of Others",1,"draft","Jin Meixiu","","",2361,"\"Dxxyox xndxrstxnd?\"\n\n...\n\n\"Dx yox xndexstxnd?\"\n\n...\n\n\"Do yox uxdxrstand?\"\n\nIt had asked this question Dozen of times already yet it seemed there was never a response. It would ask, watch, wait, yet there had never been a being that could fully comprehend. In contrast to outside, it was much easier to communicate with the beings inside the caves. Many times, it would reach out, nearly able to express a message before failure.\n\nThere seemed to be something that blocked it. What exactly, it did not know.\n\nIt began thinking about its past. Previously, it could not see as much as it did now. The things within sight was limited to only the sprawling cave system. Occasionally, it would catch glimpses of a vastly different space, and now it could directly peer into those spaces."],[7,"Blue Mountain",1,"draft","Jin Meixiu","","",2541,"\"The Blue Mountain Sword Technique has an emphasis on dominating the opponent. Each strike should be unyielding, never backing down from direct confrontation...\" Jin guangli stood with his sword stabbed directly into the earth. His mouth was the only thing moving as his hands rested heavily on his sword. Back straight, eyes bright, he narrated the principles of the sword technique to his son, Jin Hai.\n\nJin Hai moved to copy his fathers stance, sticking his sword into the hard ground, he was always a prudent student. As the words fell onto his ears, he would listen with intent as he moved accordingly.\n\n\"The first form of the Blue Mountain sword technique is simple to grasp. With the world on your shoulders, the weight of the sword becomes immeasurable!\""],[8,"Desertification",1,"draft","Jin Meixiu","","",3193,"'Such a city, who would have thought this desert would have this kind of thing.' Jin Meixiu was standing in the sky looking down at a Desert Stone City. There was a lot to think about here, as there were many kinds of peculiarities.\n\n'Over the east, the main celestial star rises, but as the day wears on, the burning sensation that permeats the city begins to increase, forming another celestial body in the sky... there must be some kind of secret down there.' Jin Meixiu was sure of it. Now that the world was shifting, things she was once familiar with was changing rapidly. Before others arrived, she had the idea to monopolize as much as she could."],[9,"Red Demon",1,"draft","","","",2124,"Sand dunes stretched far in every direction. What was once a lush verdant forest had resembled nothing from its past. The sand spread rampantly over the surrounding area, corrupting the lands with its death grip over life's neck. The greenery that surrounded Jin Hai's training spot appeared to have vanished overnight.\n\nxi-xing, xi-xi-xing!\n\nThe sound of cuts could be heard before settling down. A single sword, a single boy, each stood facing each other with several hundred feet between them. Jin Hai stared down the sword, he felt this sword had some intelligence of its own. It could respond to his attacks in ways that were subtly different, disrupting his own plans of attack and ruining his countermeasures."],[10,"waiting",1,"draft","","","",2510,"Yu Lin sat on a nearby rock. His gaze traveled between a barrier and a small disk in his hands. Nearly a year ago he had been stationed here to await young master Jin return. Yet so much time has past and the young master had yet to come out.\n\nWhy was he here? Was there even someone past this barrier?\n\nYu Lin lamented, 'After helping rebuild the city, my greed got the best of me. If I had known trying to help out so much would land me in this position, I would have said nothing at all.'\n\nFox demons were normally used as personal messengers. Before he joined that ragtag group, he had been a confident for his previous boss. He would be at the forefront of information gathering and transport. The benefits were immense relative to his abilities."],[11,"Jin Family City",1,"draft","","","",2756,"\"Woah, there's so many different people, what are they doing on the side of the road?\" Jin Hai was big eyed, staring at all the sights along the road inside the desert stone city. There were thousands of people, just in his sights, he could hardly see anything else.\n\nYu Lin followed Jin Hai's gaze, \"The people returning with treasures and goods, normally sell them here. The edge of the city is the best place to catch things as they come in. Often times, these are workers for large shops, each competing for the best prices.\"\n\nJin Hai looked but didn't understand. There were many shops, some with sparkling jewelry, and others with specialty items. The many choices were overwhelming. Outside of the things his parents showed him on occasion, he had never seen so much stuff before."],[12,"Return",1,"draft","","","",2529,"Golden warmth washed over grass, plants and stone walkways. Paths criss crossed under this light, sometimes shaded from an overhang or leading to decorated door.\n\nAmidst the beautiful scenary was a Large opening. Behind the doors was an ornate table. At the head of the table sat Jin Guangli, with Jin Meixiu standing behind him. Six elders sat along the sides of the table, each in a heated discussion.\n\nOne of the elders observed the arguing five, a vein began popping out of her head as she spoke, \"You old fools, none of these are feasible!\"\n\nThe others simmered down at her outburst, they collectively turned their attention towards her."],[13,"Test",1,"draft","","","",2392,"\"Father, We're going to fight here?\"\n\nJin Hai looked across the gardens. He had strode past here earlier, the densly packed foilage was all around him. Their surroundings was backed with a few dozen people. Some important figures had heard of the young master returning and rushed to meet him.\n\nEven the elders were sligthly puzzled, were they really going to fight here?\n\nThis...Didn't seem apropriate.\n\nJin Meixiu had caught up to the crowd and stepped out, her downcast face from before was gone but her smile had still not returned.\n\nShe looked at Jin Guangli and asked, \"Do you have a specific place in mind?\"\n\n\"Hmm...\" Jin Guangli gave his beard a few strokes."],[14,"Worries",1,"draft","","","",2453,"Jin Guangli was holding a thick blanket, wrapping it around the shoulders of his wife, the cover drapped down to the floor. He took a knee in front of her, looking deep into her eyes. The fire behind him could be clearly seen reflecting from within as the smoke from the burning wood rose into the air. The burning embers almost as deep a red as the gems they reflected from.\n\n\"You've been holding yourself back all this time, my dear, you should have already advanced past this. I've felt for a long time that you've been afraid of something, but i've ignored it. Maybe I shouldn't have, because now I see fear wearing itself on your face. With me here, what could you be worried about?\""],[15,"Signs",1,"draft","","","",3544,"\"Not just the disiples, but even the first elder He Shen is unable to aproach this void crack?\" Jin Guangli could not believe his ears. \"He's close to the peak of the Acension realm, yet he's unable to enter?\"\n\nThey had been dealing with this new void crack for a while now. This sudden news was most unwelcome.\n\nLei biya nodded. She began mulling over the reports she had so far, \"They cannot. I just finished treating the first elder before reporting directly to you. The disciples do not remember aproaching the void crack and some parts of the first elder memories are out of order. Although, he does remember stepping foot into the light of the corridor before falling into a daze and fainting. He does not know how he escaped. Besides the loss of memory, there doesn't seem to be any lasting damage.\""],[16,"Formation",1,"draft","","","",2221,"The field of mist and fog had shrunken considerably. In this particular world, the ceiling was a stone roof with carvings litering the walls. What stood out immediately was the flawless white stone book that laid amongst the many jades on the floor.\n\n'I am changing. This is change'\n\nLooking at the forming book, the being had felt a sense of satisfaction.\n\nThe being had never ceased having these thoughts. After the first time it felt the desire to change, this was the only thing it had on its mind. its conciousness lingered more closely to the gemstones, severely decreasing the range of things it could see elsewhere. Although interested in observing the outside world, it felt that this was the right choice if it truly wanted to one day interact with it."],[17,"Formation",1,"draft","","","",2135,"\"What a shame, If I had just a few more moments, I could have finished the battle properly. Such a feeling leaves a bad taste.\"\n\nJin guangli was shaking his head as he recounted his experiences. His eyes were now fully awake but his demeanor was poor. He did not want to leave his battle as it was.\n\nTaking notice of his surroundings, his wife was deeper inside the cave. The previous animosity from the forest couldn't be felt inside this space. At his leisure he started forward, \"Oh, it seems I must have been far too immersed. Looks like you already obtained the treasure that was to be had, haha, as expected. Nothing can escape your grasp!\""],[18,"Celebration",1,"draft","","","",3412,"Many hours had already passed since the family heads had entered the rift. Lei Biya stood patiently, waiting for them to come back. It was natural that the problem could not be resolved so easily. After all, they were dealing with some extra ordinary treasure. It would be strange if it took less time than it took for an incense stick to burn to handle the problem.\n\nLei Biya looked around the stone forest, the natural formation that formed intrigued her greatly. Glancing around, she had her own thoughts.\n\n\"I wonder what kind of treasure they are dealing with? It would be nice if they can acquire it for the family but that may not be likely.\""],[19,"Troublesome Matters",1,"draft","","","",1912,"Familiar scenes played endlessly within the mind. Amidst its stupor, the being had watched these events repeat constantly. They would speak words, share knowledge and impart wisdom before it could no longer understand. It seemed like an eternity would pass between small moments like this. It would be partially awake, watching as the scenes flashed by.\n\n...thump...thump...thump...\n\nA slow rythmic beat echoed deeply within the mind.\n\n'This... is this, sound? I don't, recall hearing, before. what is...this?'\n\n...thump...thump...thump...\n\n'That sound again, whats making this noise? Its becoming louder.'\n\nA lullaby was whistled, distracting its attention. It felt a wind wrap itself alongs its body, entwinning itself deeply as the words wrapped itself around its mind before dissipaiting softly in the wind that brought it."],[20,"clarity",2,"draft","","","",2202,"A room adourned with many arrays began glowing in the morning light. As it creeped its way throughout the room, someone had begun to stir.\n\n'Is it morning already?'\n\nJin Meixiu eyes wandered back to life. She had been watching over her daughter for so long. Now that she had rested, she had forgotten all about this sensation.\n\n'Was I sleeping? How long has it been since I've done something like that?'\n\nPotent beings like her did not sleep, or rather, the act of body refinement felt better than sleeping and would leave the mind refreshed. It seems at some point she had begun to rest instead of watch.\n\nRecently, the marble like egg had not been as active and today she felt it was awfully still. Above her head, several array markers were glowing brightly and the newest one was also faintly visible."],[21,"Senses",2,"draft","","","",3155,"\"Agh!\" Lin Mei exited her lotus position, grabbing her stomach as she shouted in a fit, \"Damn that bastard, if I could boil him alive I would! I'm Completely crippled, dammit!\"\n\nFor the last few days, she had been trying to gather energy, with it, should would be able to see in the dark and start her journey once more but every single energy channel in her body was either broken, mangled, completely unable to contain energy much less form a circuit neccesary for cultivation.\n\nShe was furious at this problem but it wasn't something she could solve Immediately. Turning to the next problem, she began to think.\n\n'Its been almost a week, yet I have not eaten anything. This wouldn't be a problem if I could circulate energy within my body but i'm currently a cripple. I should be nearly starved to death by now. Whats going on?'"],[22,"Light",2,"draft","","","",2115,"Thump! Thump! Thump!\n\nMuted First landed on a stone facade, they crackled and shook before another well timed strike hit against the wall. There was a steady rythym as Lin Mei made sure not to use too much strength but just enough that she could feel a certain weakness permeate throughout her tendons, up her arm and through her body. The feeling made her want to retract her hand, but she held it there, until the time for the other first landed.\n\nIt was methodical and consistent. This was her only path forward.\n\n'Strike. Wait. Hit. Wait. Strike. wait...'\n\nshe repeated these words endlessly, until she could no longer keep the pace. Both hands withrawn from the wall, she honed her intent and struck with both hands at the same time,"],[23,"Hole",2,"draft","","","",2353,"Controlling the sensation, a bloody shin had begun to be infused with a special energy. She did not have a name for this feeling but she had been practicing controlling it. With a bit of will power, this energy could gather from all around her body and could repair her wounds.\n\n'hmm~ Internal vigor?'\n\nshe shook her head, she had been debating this for days now, she needed a name for this feeling.\n\n'how about...Mending...Mending Flow? yea, that sounds good. Am I a genius or what?'\n\nHowever it was not omnipotent. Still sitting with a bloody leg, she counted down the time it took before it healed. Meanwhile, her hand gracefully glided amongst the ground until it encountered a small river rock. Every so many seconds, she would move a another small stone a little further than the others beside her. She kept doing this before eventually she ran out of stones and began moving them back beside her."],[24,"Freedom",2,"draft","","","",1842,"Roar!\n\nA furious bellow rang out, teeth, several inches long dug into the shoulder of the outstreached arm. Lin Mei recoiled and winced as the bone crushing maw dug deep into her flesh without regard. Lin Mei grabbed whatever fleshy substance she could inside but she was Unable to resist. The bear snatched her small body up into air and hurled it back into the cave.\n\nSkittering accross the stone floor, the pain had not yet completely registered as she was caught by the cold embrace of the stone wall. The sound of a loud impact resounded as she had the wind, completely knocked out of her. She could neither inhale or exhale properly."],[25,"Human",2,"draft","","","",2844,"'Feels so soft, am I being carried?'\n\nLin mei felt extremely groggy, as if she had not awoken for eons. Her chest was pressed against someones back as they carried her quickly. One of her arms was slung over someones' shoulder and her legs where grasped firmly. The one arm that dangled to her side was in a wooden sling, braced from all movement but moved freely all togethor.\n\nShe took this moment to arouse, but kept herself limp like she had been this entire time. On one hand, she had been sleeping on rock. Where had she felt something like this before? She couldn't recall clearly. On the other hand, she felt comfortable but not safe. Carefully, her eyes opened to see what lies beyond them."],[26,"Outer Cloud Sect, A dead Scholar",2,"draft","","","",618,"Shock resounded throughout the clearing.\n\nWhat was an Imperial Scholar? Only people without aspiration wouldn't know.\n\nAn empire starts with its people and the people listen to the king. The kings congregate with their peers as both allies and enemies. But even they must listen when the emperor speaks. This was the way of the world.\n\nBut who does the emperor listens to? One might say the gods themselves, others say its the godlike figures who stands in gods absence. Truthfully, its difficult to say. Dealing in both mortal and immortal matters, the emporer is a key figure who unifies both parties. Therefore this glue must represent only the best of both sides. So instead of who the emperor listens to, the proper question is who did he listen to? Who shaped his world views and who did he idolize."],[27,"Beginning",2,"draft","","","",9,"this is when the mc gets hit and *dies"],[28,"unknown",2,"draft","","","",1693,"Chapter unkown - Scare\n\n\"You're after my body aren't you, White\"\n\nA voice flowed in from outside the walls. Jin Dandan opened one eye slightly. She couldn't see through them however this habit could not be broken so easily. It was just a moment but she shut them again.\n\n\"Aren't I in my own? Are you so special? You have been thinking too much, I simply become restless when I think about how you are still alive after what you've done to me.\"\n\nThere was a period of silence. She smiled, that orange eyed demon had always been like this. They shared many similarities and deep thinking was one of those."],[29,"",2,"planned","","","",0,""]]

    path: SAMPLE_PATH, name: 'Strongest World',
    book: {
      title: 'Strongest World', subtitle: '', series: '', seriesNo: '', author: 'lilmart210', cover: null,

      logline: 'Humans have spent every generation seeking the pinnacle of strength. After watching for a thousand years, Jin Dandan wondered just how she would attain the title of the strongest.',

// The text around a scrap as it reads now — cut at paragraph breaks and whole words.
function scrapContext(c, sc, n = 80) {
  const end = sc.at + sc.len
  let before = c.body.slice(Math.max(0, sc.at - n), sc.at)
  let after = c.body.slice(end, end + n)
  const bp = before.lastIndexOf('\n')
  if (bp >= 0) before = before.slice(bp + 1)
  else if (sc.at > n) before = '…' + before.replace(/^\S*\s/, '')
  const ap = after.indexOf('\n')
  if (ap >= 0) after = after.slice(0, ap)
  else if (end + n < c.body.length) after = after.replace(/\s\S*$/, '') + '…'
  return { before, now: c.body.slice(sc.at, end), after }
}
function scrapFlow(c, sc) {

  const pending = sc.rewrite && !sc.sealed && !x.now
  return `<span class="ctx">${esc(x.before)}</span><del>${esc(sc.text)}</del>${x.now ? `<ins>${esc(x.now)}</ins>` : pending ? '<span class="caretmark" title="Type the new version here"></span>' : ' '}<span class="ctx">${esc(x.after)}</span>`

// ---------- caret geometry in a textarea (mirror div) ----------
let MIRROR = null
function caretXY(ta, offset) {
  if (!MIRROR) { MIRROR = document.createElement('div'); MIRROR.setAttribute('aria-hidden', 'true'); document.body.appendChild(MIRROR) }
  const cs = getComputedStyle(ta)
  for (const p of ['fontFamily', 'fontSize', 'fontWeight', 'fontStyle', 'lineHeight', 'letterSpacing', 'wordSpacing', 'textIndent', 'paddingTop', 'paddingRight', 'paddingBottom', 'paddingLeft', 'tabSize']) MIRROR.style[p] = cs[p]
  Object.assign(MIRROR.style, { position: 'absolute', visibility: 'hidden', whiteSpace: 'pre-wrap', overflowWrap: 'break-word', top: '0', left: '-9999px', width: ta.getBoundingClientRect().width + 'px', boxSizing: 'border-box' })
  MIRROR.textContent = ta.value.slice(0, offset)
  const mark = document.createElement('span')
  mark.textContent = '\u200b'
  MIRROR.appendChild(mark)
  return { top: mark.offsetTop, left: mark.offsetLeft }
}
// Cards sit beside the line they were cut from; when two are close they stack.
function layoutScraps() {
  const ta = $('#chbody')
  if (!ta) return
  const c = chap(ta.dataset.ch)
  const narrow = window.matchMedia('(max-width:720px)').matches
  let bottom = -Infinity
  for (const sc of [...c.scraps].sort((a, b) => a.at - b.at)) {
    const el = document.querySelector(`[data-scrap="${sc.id}"]`)
    if (!el) continue
    if (narrow) { el.style.top = ''; continue }
    const y = ta.offsetTop + caretXY(ta, Math.min(sc.at, ta.value.length)).top
    const top = Math.max(y, bottom + 8)
    el.style.top = top + 'px'
    bottom = top + el.offsetHeight
  }
}
function refreshScraps() {

  const c = chap(ta.dataset.ch)
  $('#scrapcol').innerHTML = c.scraps.map((sc) => scrapCard(c, sc)).join('')

// word-level diff (LCS after trimming the shared head and tail)
function diffWords(a, b) {
  const A = a.match(/\S+\s*/g) || [], B = b.match(/\S+\s*/g) || []
  const key = (t) => t.trimEnd()
  let lo = 0
  while (lo < A.length && lo < B.length && key(A[lo]) === key(B[lo])) lo++
  let ha = A.length, hb = B.length
  while (ha > lo && hb > lo && key(A[ha - 1]) === key(B[hb - 1])) { ha--; hb-- }
  const a2 = A.slice(lo, ha), b2 = B.slice(lo, hb), n = a2.length, m = b2.length
  const T = new Uint16Array((n + 1) * (m + 1))
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    T[i * (m + 1) + j] = key(a2[i]) === key(b2[j]) ? T[(i + 1) * (m + 1) + j + 1] + 1 : Math.max(T[(i + 1) * (m + 1) + j], T[i * (m + 1) + j + 1])
  const ops = B.slice(0, lo).map((t) => ['=', t])
  let i = 0, j = 0
  while (i < n && j < m) {
    if (key(a2[i]) === key(b2[j])) { ops.push(['=', b2[j]]); i++; j++ }
    else if (T[(i + 1) * (m + 1) + j] >= T[i * (m + 1) + j + 1]) ops.push(['-', a2[i++]])
    else ops.push(['+', b2[j++]])
  }
  while (i < n) ops.push(['-', a2[i++]])
  while (j < m) ops.push(['+', b2[j++]])
  return ops.concat(B.slice(hb).map((t) => ['=', t]))
}
const versionText = (c, id) => (id === 'now' ? c.body : c.versions.find((x) => x.id === id)?.text ?? '')
const versionName = (c, id) => (id === 'now' ? `Draft ${c.draft} (working)` : `Draft ${c.versions.find((x) => x.id === id).n}`)
function diffHTML(c, fromId, toId) {
  const ops = diffWords(versionText(c, fromId), versionText(c, toId))
  const added = ops.filter((o) => o[0] === '+').length, removed = ops.filter((o) => o[0] === '-').length
  let html = '', cur = null, buf = ''
  const flush = () => { if (!buf) return; html += cur === '+' ? `<ins>${esc(buf)}</ins>` : cur === '-' ? `<del>${esc(buf)}</del>` : esc(buf); buf = '' }
  for (const [op, t] of ops) { if (op !== cur) { flush(); cur = op } buf += t }
  flush()
  const all = [...c.versions.map((x) => ({ id: x.id, short: String(x.n), long: `Draft ${x.n} · ${x.date}` })), { id: 'now', short: 'Now', long: `Draft ${c.draft} (working)` }]
  const fi = all.findIndex((x) => x.id === fromId), ti = all.findIndex((x) => x.id === toId)
  const opts = (sel) => all.map((x) => `<option value="${x.id}" ${x.id === sel ? 'selected' : ''}>${esc(x.long)}</option>`).join('')
  const strip = all.map((x, i) => `<button class="dchip ${i === fi ? 'from' : ''} ${i === ti ? 'to' : ''} ${i > fi && i < ti ? 'mid' : ''}" data-act="dpick" data-ch="${c.id}" data-id="${x.id}" title="${esc(x.long)} — click: compare from · shift-click: compare to">${x.short}</button>`).join('')
  return wrap(`

    <div class="diffbar">

      <span class="dstat"><ins>+${fmt(added)}</ins> <del>−${fmt(removed)}</del> words</span>
      <span class="sp" style="flex:1"></span>
      ${fromId !== 'now' ? `<button class="btn" data-act="restore" data-id="${c.id}" data-ver="${fromId}" ${versionText(c, fromId) === c.body ? 'disabled' : ''}>${I.restore} Restore ${esc(versionName(c, fromId))}</button>` : ''}
    </div>

function draftsPane(c, selected) {
  const st = chapterState(c)

  if (st === 'changed' || st === 'new') rows.push(`<button class="gitrow now ${selected === 'now' ? 'on' : ''}" ${v ? `data-act="open" data-doc="diff:${c.id}:${v.id}:now"` : 'disabled'} title="${v ? 'What changed since draft ' + v.n : 'Not published yet'}"><i></i><span class="gn">Draft ${c.draft}</span><span class="gd">working</span><span class="gw">${v ? signedWords(wc(c.body) - wc(v.text)) : fmt(wc(c.body)) + ' w'}</span></button>`)

// ---------- search ----------
function renderSearch() {
  const q = $('#search').value.trim()
  const box = $('#sresults')
  renderCrumbs()
  if (!q) { box.hidden = true; return }
  const lq = q.toLowerCase()
  const docs = [...['overview', 'blurb', 'synopsis', 'publishing', 'outline'], ...S.arcs.map((a) => 'arc:' + a.id), ...chapterOrder().map((c) => 'ch:' + c.id), ...S.pages.map((p) => 'pg:' + p.id)]
  const titleHits = docs.filter((k) => docLabel(k).toLowerCase().includes(lq) || (k.startsWith('pg:') && pg(k.slice(3)).aliases.some((a) => a.toLowerCase().includes(lq)))).slice(0, 8)
  const textOf = (k) => (k.startsWith('ch:') ? chap(k.slice(3)).body : k.startsWith('pg:') ? `${pg(k.slice(3)).summary}\n${pg(k.slice(3)).body}` : k === 'synopsis' ? S.syn.body : k === 'blurb' ? S.blurb.body : '')
  const textHits = []
  for (const k of docs) {
    if (textHits.length >= 8) break
    const t = textOf(k), i = t.toLowerCase().indexOf(lq)
    if (i < 0) continue
    const snip = t.slice(Math.max(0, i - 30), i + q.length + 40).replace(/\s+/g, ' ')
    const j = snip.toLowerCase().indexOf(lq)
    textHits.push({ k, html: `…${esc(snip.slice(0, j))}<mark>${esc(snip.slice(j, j + q.length))}</mark>${esc(snip.slice(j + q.length))}…` })
  }
  const all = [...titleHits.map((k) => ({ k, html: esc(docLabel(k)), loc: SECTION_LABEL[docSection(k)] })), ...textHits.map((h) => ({ ...h, loc: docLabel(h.k) }))]
  UI.searchIdx = Math.min(UI.searchIdx, Math.max(0, all.length - 1))
  let n = 0
  const item = (h) => `<div class="sitem ${n++ === UI.searchIdx ? 'hl' : ''}" data-act="sr" data-doc="${h.k}"><span class="k">${SECTION_LABEL[docSection(h.k)]}</span><span class="m">${h.html}</span><span class="loc">${esc(h.loc)}</span></div>`
  box.innerHTML = (titleHits.length ? '<div class="stier">Titles</div>' + all.slice(0, titleHits.length).map(item).join('') : '')
    + (textHits.length ? '<div class="stier">In text</div>' + all.slice(titleHits.length).map(item).join('') : '')
    || '<div class="stier">No matches</div>'
  box.hidden = false
  box.dataset.docs = all.map((h) => h.k).join('|')
}

const STRUCTURAL = /^(book\.title|ch\.[^.]+\.(title|number|arc)|arc\.[^.]+\.name|pg\.[^.]+\.title)/
let DOCK_TIMER = null
function setBind(key, el) {
  const parts = key.split('.')
  const [kind, id] = parts
  const rest = parts.slice(2).join('.')
  const val = el.value
  // typing into a versioned chapter flips it to "edited" — the tree and dock need to show that at once
  const flipCh = kind === 'bd' ? draftDoc(id) : kind === 'ch' && rest === 'body' ? chap(id) : null
  const wasEdited = flipCh ? isEdited(flipCh) : false
  if (kind === 'book') S.book[id] = id === 'target' ? (val === '' ? '' : Math.max(0, Number(val) || 0)) : val
  else if (kind === 'pub') S.pub[id] = val
  else if (kind === 'bd') draftDoc(id).body = val
  else if (kind === 'ch' && rest === 'body') applyBodyEdit(chap(id), val, el.selectionStart)
  else if (kind === 'top') { const [i, f] = rest.split('.'); chap(id).topics[Number(i)][f] = val }
  else if (kind === 'plan') S.book.plan[id] = val === '' ? '' : Math.max(0, Number(val) || 0)
  else if (kind === 'ch') { const c = chap(id); if (rest === 'number') { if (val !== '') c.number = Number(val) } else if (rest === 'arc') c.arc = val || null; else c[rest] = val }
  else if (kind === 'arc') arcOf(id)[rest] = rest === 'plan' ? (val === '' ? '' : Math.max(0, Number(val) || 0)) : val
  else if (kind === 'pg') pg(id)[rest] = val
  else if (kind === 'pgf') pg(id).fields[Number(rest)].v = val
  else if (kind === 'pgc') { const p = pg(id), col = decodeURIComponent(rest); const f = p.fields.find((f) => f.k === col); if (f) f.v = val; else p.fields.push({ k: col, v: val }) }
  else if (kind === 'plat') S.pub.platforms.find((p) => p.id === id)[rest] = val
  EDITS++
  $$('[data-bind]').forEach((o) => { if (o !== el && o.dataset.bind === key && o.value !== val) o.value = val })
  $$('[data-count]').forEach((o) => { if (o.dataset.count === key) o.textContent = countLine(val) })
  $$('[data-slot]').forEach((o) => { if (o.dataset.slot === key) o.innerHTML = propLinkSlot(val) })
  $$('[data-show]').forEach((o) => { if (o.dataset.show === key) o.textContent = `Chapter : ${fmtNum(val)}` })
  if (kind === 'plan' || (kind === 'arc' && rest === 'plan')) { refreshPlan(el); renderExplorer(); renderDock() }
  if (kind === 'ch' && rest === 'body' && chap(id).scraps.length) requestAnimationFrame(refreshScraps)
  autosize(el)
  flashSaving()
  const inDoc = !!el.closest('#doc'), inDock = !!el.closest('#dock')
  const flipped = !!flipCh && isEdited(flipCh) !== wasEdited
  if (STRUCTURAL.test(key) || flipped) {
    renderExplorer(); renderTabs(); renderCrumbs()
    if (!inDoc || el.tagName === 'SELECT') renderDoc()
    if (!inDock) renderDock()
  } else if (!inDock) {
    clearTimeout(DOCK_TIMER)
    DOCK_TIMER = setTimeout(() => { if (!document.activeElement?.closest('#dock')) renderDock() }, 350)
  }
}

// ---------- quick add (folder tables, sub-pages) ----------
function parseEntry(line) {
  let s = line.trim().replace(/^[-*•]\s+/, '')
  if (!s) return null
  let ch = ''
  const m = s.match(/[.,;]?\s*\b(?:ch(?:apter)?\.?)\s*(\d+(?:\.\d+)?)\s*\.?$/i)
  if (m) { ch = 'Ch. ' + m[1]; s = s.slice(0, m.index).trim() }
  const sp = s.match(/^(.+?)\s+[-–—:]\s+(.+)$/)
  const name = titleCase((sp ? sp[1] : s).trim())
  const desc = sp ? sp[2].trim().replace(/^\p{Ll}/u, (c) => c.toUpperCase()) : ''
  return { name, desc, ch }
}
function quickAdd(parentId, text) {
  const parent = pg(parentId)
  const entries = text.split(/\r?\n/).map(parseEntry).filter(Boolean)
  if (!entries.length) return 0
  for (const e of entries) {
    const p = newPage({ section: parent.section, parent: parent.id, title: e.name, summary: e.desc })
    const firstCol = p.fields.find((f) => /first/i.test(f.k))
    if (e.ch && firstCol) firstCol.v = e.ch
  }
  S.open['pg:' + parent.id] = true
  renderExplorer(); renderDoc(); renderDock(); renderStatus(); flashSaving()
  $(`[data-quickadd="${parentId}"]`)?.focus()
  return entries.length
}
document.addEventListener('paste', (e) => {
  const el = e.target
  if (!el.dataset?.quickadd) return
  const text = e.clipboardData?.getData('text') || ''
  if (!text.includes('\n')) return
  e.preventDefault()
  const n = quickAdd(el.dataset.quickadd, text)
  toast(`Added ${n} entr${n === 1 ? 'y' : 'ies'}`)
})

// ---------- inline inputs (create / rename / fields / columns / chips) ----------
// fromBlur: the user clicked elsewhere — keep their name but don't steal the
// click by opening the new page; render after the click has been handled.
function commitInline(el, cancel, fromBlur = false) {
  const v = el.value.trim()
  const later = (fn) => (fromBlur ? setTimeout(fn) : fn())
  if (el.dataset.inline === 'create') {
    const o = UI.creating
    UI.creating = null
    if (!o || cancel || !v) { later(renderExplorer); return }
    if (o.kind === 'arc') {
      const a = { id: uid(), name: v, summary: '' }
      S.arcs.push(a); S.open['arc:' + a.id] = true; EDITS++
      later(() => (fromBlur ? renderAll() : openDoc('arc:' + a.id)))
      return
    }
    const p = newPage({ section: o.section, parent: o.parent || null, title: v, folder: o.kind === 'folder' })
    later(() => (fromBlur ? renderAll() : openDoc('pg:' + p.id)))
    return
  }
  if (el.dataset.inline === 'rename') {
    const key = UI.renaming
    UI.renaming = null
    if (key && !cancel) {
      const [kind, id] = key.split(':')
      if (kind === 'pg' && v) pg(id).title = v
      if (kind === 'arc' && v) arcOf(id).name = v
      if (kind === 'ch') chap(id).title = v
      EDITS++; flashSaving()
    }
    later(() => { renderExplorer(); renderTabs(); renderCrumbs(); renderDoc(); renderDock() })
  }
}
document.addEventListener('keydown', (e) => {
  const el = e.target
  if (e.key === 'Escape') {
    if (el.dataset?.inline) { commitInline(el, true); return }
    if (el.dataset?.fieldadd || el.dataset?.coladd || el.dataset?.olarc) { UI.addingField = UI.addingCol = null; UI.olNewArc = false; renderDoc(); return }
    if (el.id === 'search') { el.value = ''; renderSearch(); el.blur(); return }
    if (UI.ctx || UI.menu) { closeOverlays(); return }
    if (UI.modal) { closeModal(); return }
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#search').focus(); return }
  if (UI.modal === 'recent' && ['ArrowDown', 'ArrowUp', 'Enter'].includes(e.key) && !el.matches('input')) {
    e.preventDefault()
    if (e.key === 'Enter') { const p = RECENTS[UI.recentIdx]; if (p) { closeModal(); loadProject(p) } return }
    UI.recentIdx = Math.max(0, Math.min(RECENTS.length - 1, UI.recentIdx + (e.key === 'ArrowDown' ? 1 : -1)))
    renderModal(); return
  }
  if (UI.modal === 'newproject' && e.key === 'Enter' && el.matches('#npTitle,#npAuthor')) { e.preventDefault(); createProject(); return }
  if (el.id === 'search' && ['ArrowDown', 'ArrowUp', 'Enter'].includes(e.key)) {
    const docs = ($('#sresults').dataset.docs || '').split('|').filter(Boolean)
    if (!docs.length) return
    e.preventDefault()
    if (e.key === 'Enter') { el.value = ''; renderSearch(); el.blur(); openDoc(docs[UI.searchIdx] || docs[0]); return }
    UI.searchIdx = Math.max(0, Math.min(docs.length - 1, UI.searchIdx + (e.key === 'ArrowDown' ? 1 : -1)))
    renderSearch(); return
  }
  if (e.key !== 'Enter' && e.key !== 'F2' && e.key !== 'Delete') return
  if (el.dataset?.inline && e.key === 'Enter') { e.preventDefault(); commitInline(el, false); return }
  if (el.dataset?.quickadd && e.key === 'Enter') { e.preventDefault(); if (quickAdd(el.dataset.quickadd, el.value)) el.value = ''; return }
  if (el.dataset?.fieldadd && e.key === 'Enter') {
    e.preventDefault()
    const p = pg(el.dataset.fieldadd), v = el.value.trim()
    UI.addingField = null
    if (v) { p.fields.push({ k: v, v: '' }); EDITS++ }
    renderDoc()
    if (v) $(`[data-bind="pgf.${p.id}.${p.fields.length - 1}"]`)?.focus()
    return
  }
  if (el.dataset?.coladd && e.key === 'Enter') {
    e.preventDefault()
    const p = pg(el.dataset.coladd), v = el.value.trim()
    UI.addingCol = null
    if (v) { const cols = [...effectiveCols(p)]; if (!cols.includes(v)) cols.push(v); p.cols = cols; EDITS++ }
    renderDoc(); return
  }
  if (el.dataset?.olarc && e.key === 'Enter') {
    e.preventDefault()
    const v = el.value.trim()
    UI.olNewArc = false
    if (v) { S.arcs.push({ id: uid(), name: v, summary: '' }); EDITS++; renderExplorer(); renderDock() }
    renderDoc(); return
  }
  if (el.dataset?.chipadd && e.key === 'Enter') {
    e.preventDefault()
    const v = el.value.trim(), list = S.book[el.dataset.chipadd]
    if (v && !list.includes(v)) { list.push(v); EDITS++; flashSaving() }
    renderDoc(); $(`[data-chipadd="${el.dataset.chipadd}"]`)?.focus(); return
  }
  if (el.dataset?.aliasadd && e.key === 'Enter') {
    e.preventDefault()
    const p = pg(el.dataset.aliasadd), v = el.value.trim()
    if (v && !p.aliases.includes(v)) { p.aliases.push(v); EDITS++; flashSaving() }
    renderDoc(); renderDock(); $(`[data-aliasadd="${p.id}"]`)?.focus(); return
  }
  const node = el.closest?.('#explorer .node[data-key]')

// ---------- scraps: anchored margin notes in a chapter ----------
// Shift every scrap anchor for an edit at p that removed r chars and inserted i.
// A Rewrite scrap stays "open": text typed at its anchor becomes the replacement until you edit elsewhere.
function shiftScraps(c, p, r, i) {
  const delta = i - r, editEnd = p + r
  for (const sc of c.scraps) {
    const end = sc.at + sc.len
    const growing = !sc.sealed && p >= sc.at && p <= end && editEnd <= end
    if (growing || (p > sc.at && editEnd < end)) { sc.len = Math.max(0, sc.len + delta); continue }
    if (editEnd <= sc.at) { sc.at += delta; sc.sealed = true; continue }
    if (p >= end) { sc.sealed = true; continue }
    if (p < sc.at) { const lost = Math.min(editEnd, end) - sc.at; sc.at = p + i; sc.len = Math.max(0, sc.len - lost) }
    else sc.len = Math.max(0, p - sc.at + i)
  }
}
function applyBodyEdit(c, next, caret) {
  const prev = c.body
  if (prev === next) return
  const max = Math.min(prev.length, next.length)
  let p = 0
  while (p < max && prev[p] === next[p]) p++
  let sfx = 0
  while (sfx < max - p && prev[prev.length - 1 - sfx] === next[next.length - 1 - sfx]) sfx++
  let r = prev.length - p - sfx, i = next.length - p - sfx
  // typing a letter that matches the next one is ambiguous — the caret says where it really went
  if (caret != null && r === 0 && i > 0 && caret - i < p && caret - i >= 0) p = caret - i
  shiftScraps(c, p, r, i)
  c.body = next
}
function scrapSelection(rewrite) {
  const ta = $('#chbody')
  const c = chap(ta.dataset.ch)
  const s0 = ta.selectionStart, e0 = ta.selectionEnd
  const text = ta.value.slice(s0, e0)
  if (!text.trim()) return
  const before = snapshot()
  const next = ta.value.slice(0, s0) + ta.value.slice(e0)
  applyBodyEdit(c, next)
  c.scraps.push({ id: uid(), text: text.trim(), at: s0, len: 0, sealed: !rewrite, rewrite, date: today() })
  EDITS++
  ta.value = next

}
function scrapAction(act, chId, id) {
  const c = chap(chId), sc = c.scraps.find((x) => x.id === id)
  if (!sc) return
  if (act === 'focus' || act === 'goto') {
    if (S.active !== 'ch:' + c.id) openDoc('ch:' + c.id)
    requestAnimationFrame(() => { const ta = $('#chbody'); if (!ta) return; ta.focus(); ta.setSelectionRange(sc.at, sc.at + sc.len) })
    return

  if (act === 'restore') applyBodyEdit(c, c.body.slice(0, sc.at) + sc.text + c.body.slice(sc.at + sc.len))
  EDITS++
  flashSaving(); renderDoc(); renderExplorer(); renderDock(); renderStatus()
  toast(act === 'restore' ? 'Put back' : 'Scrap dismissed', () => { S = before; PROJECTS[S.path] = S; EDITS++; renderAll() })
}

function updateSelMenu() {

// The newest change: last published draft → working text, or between the last two published drafts.
function compareTarget(c) {
  const vs = c.versions
  if (!vs.length) return null
  if (isEdited(c) || vs.length === 1) return `diff:${c.id}:${vs[vs.length - 1].id}:now`
  return `diff:${c.id}:${vs[vs.length - 2].id}:${vs[vs.length - 1].id}`
}
function swapDiff(chId, from, to) {
  const c = draftDoc(chId)
  const order = [...c.versions.map((v) => v.id), 'now']
  if (from === to) return
  if (order.indexOf(from) > order.indexOf(to)) [from, to] = [to, from]
  const next = `diff:${chId}:${from}:${to}`
  const i = S.tabs.indexOf(S.active)
  if (i >= 0 && S.active.startsWith('diff:')) S.tabs[i] = next
  else if (!S.tabs.includes(next)) S.tabs.push(next)
  S.active = next
  renderAll()
}

  }
  if (a === 'toggle') { e.stopPropagation(); S.open[d.key] = !S.open[d.key]; renderExplorer(); return }
  if (a === 'sec') { S.open[d.key] = S.open[d.key] === false; renderExplorer(); return }

  if (a === 'menu') { UI.menu = UI.menu === d.menu ? null : d.menu; UI.ctx = null; renderMenubar(); renderOverlay(); return }
  if (a === 'mi') { const it = menuItems(UI.menu)[Number(d.i)]; closeOverlays(); it.fn(); return }

  if (a === 'tab') { if (S.active !== d.doc) { S.active = d.doc; renderAll() } return }

  if (a === 'cover-pick') { e.stopPropagation(); $('#coverFile').click(); return }
  if (a === 'cover-clear') { e.stopPropagation(); S.book.cover = null; EDITS++; renderExplorer(); renderDoc(); return }
  if (a === 'plat-add') { const p = { id: uid(), name: '', url: '', note: '' }; S.pub.platforms.push(p); EDITS++; renderDoc(); $(`[data-bind="plat.${p.id}.name"]`)?.focus(); return }
  if (a === 'plat-del') { S.pub.platforms = S.pub.platforms.filter((p) => p.id !== d.id); EDITS++; renderDoc(); return }
  // outline / arcs / chapters
  if (a === 'publish') { doPublish(draftDoc(d.id)); return }
  if (a === 'publish-all') {
    const list = chapterOrder().filter(canPublish)
    withUndo(`Published ${list.length} draft${list.length === 1 ? '' : 's'}`, () => list.forEach((c) => publishDraft(c, true)))
    return
  }
  if (a === 'diff') { const t = compareTarget(draftDoc(d.id)); if (t) openDoc(t); return }
  if (a === 'dpick') { const [, , from, to] = S.active.split(':'); if (e.shiftKey) swapDiff(d.ch, from, d.id); else swapDiff(d.ch, d.id, to || 'now'); return }
  if (a === 'restore') {
    const c = draftDoc(d.id), v = c.versions.find((x) => x.id === d.ver)
    withUndo(`Restored draft ${v.n} as the working text`, () => { c.body = v.text })
    return
  }
  if (a === 'exp-src') { UI.exp.source = d.v; renderModal(); return }
  if (a === 'export-open') { openModal('export'); return }
  if (a === 'exp-fmt') { UI.exp.fmt = d.v; renderModal(); return }
  if (a === 'exp-trim') { UI.exp.trim = d.v; renderModal(); return }
  if (a === 'exp-scope') { UI.exp.scope = d.v; renderModal(); return }
  if (a === 'exp-go') {
    const f = EXPORT_FORMATS.find((x) => x.id === UI.exp.fmt), n = exportChapters().length
    closeModal()
    toast(UI.exp.fmt === 'serial' ? `In the app: writes ${n} chapter files to exports/serial/` : `In the app: writes exports/${S.book.title || 'book'}.${f.ext}`)
    return
  }
  if (a === 'ai-open') { openModal('ai'); renderRail(); return }
  if (a === 'ai-get') { aiDownload(d.id); return }
  if (a === 'ai-filter') { UI.aiFilter.tag = d.v; refreshAI(); return }
  if (a === 'copy') {
    const text = d.what === 'tags' ? S.book.tags.join(', ') : d.what === 'logline' ? S.book.logline : d.what === 'synopsis' ? S.syn.body : d.what === 'blurb' ? S.blurb.body : ''
    const label = { tags: 'tags', logline: 'logline', synopsis: 'synopsis', blurb: 'blurb' }[d.what]
    try { navigator.clipboard.writeText(text).then(() => toast(`Copied ${label}`), () => toast('Clipboard is blocked here — select the text and press Ctrl+C')) }
    catch { toast('Clipboard is blocked here — select the text and press Ctrl+C') }
    return
  }
  if (a === 'topic-add') { const c = chap(d.id); c.topics.push({ title: '', note: '', done: false }); EDITS++; renderDock(); $(`[data-bind="top.${c.id}.${c.topics.length - 1}.title"]`)?.focus(); return }
  if (a === 'topic-done') { const t = chap(d.id).topics[Number(d.i)]; t.done = !t.done; EDITS++; flashSaving(); renderDock(); return }
  if (a === 'topic-del') { chap(d.id).topics.splice(Number(d.i), 1); EDITS++; flashSaving(); renderDock(); return }
  if (a === 'ai-remove') {
    delete AI.installed[d.id]
    for (const [t] of AI_TASKS) if (AI.tasks[t] === d.id) AI.tasks[t] = AI_MODELS.find((m) => AI.installed[m.id])?.id || ''
    refreshAI(); return
  }
  if (a === 'sel-cut') { selClipboard(true); return }
  if (a === 'sel-copy') { selClipboard(false); return }
  if (a === 'sel-scrap') { scrapSelection(false); return }
  if (a === 'sel-rewrite') { scrapSelection(true); return }
  if (a === 'scrap-focus') { scrapAction('focus', d.ch, d.id); return }
  if (a === 'scrap-goto') { scrapAction('goto', d.ch, d.id); return }
  if (a === 'scrap-restore') { e.stopPropagation(); scrapAction('restore', d.ch, d.id); return }
  if (a === 'scrap-del') { e.stopPropagation(); scrapAction('dismiss', d.ch, d.id); return }
  if (a === 'ol-plan') { const c = newChapter(d.arc); renderExplorer(); renderDoc(); renderDock(); $(`[data-bind="ch.${c.id}.title"]`)?.focus(); return }
  if (a === 'ol-arc') { UI.olNewArc = true; renderDoc(); $('[data-olarc]')?.focus(); return }
  if (a === 'newch-doc') { createChapterAndOpen(d.arc); return }
  if (a === 'ch-step') { const order = chapterOrder(); const i = order.indexOf(chap(S.active.slice(3))) + Number(d.d); if (order[i]) openDoc('ch:' + order[i].id); return }
  // pages
  if (a === 'field-add') { UI.addingField = d.id; renderDoc(); $(`[data-fieldadd="${d.id}"]`)?.focus(); return }
  if (a === 'field-del') { pg(d.id).fields.splice(Number(d.i), 1); EDITS++; renderDoc(); return }
  if (a === 'col-add') { UI.addingCol = d.id; renderDoc(); $(`[data-coladd="${d.id}"]`)?.focus(); return }
  if (a === 'col-del') { const p = pg(d.id); p.cols = effectiveCols(p).filter((c) => c !== d.col); EDITS++; renderDoc(); toast(`Removed column “${d.col}” · values stay on each page`); return }
  if (a === 'alias-del') { pg(d.id).aliases.splice(Number(d.i), 1); EDITS++; renderDoc(); renderDock(); return }
  if (a === 'pg-del') { deletePage(pg(d.id)); return }
  // modals
  if (a === 'modal-bg') { if (e.target === el) closeModal(); return }
  if (a === 'modal-close') { closeModal(); return }
  if (a === 'modal-browse') { closeModal(); toast('Opens the folder picker in the app.'); return }
  if (a === 'recent-open') { closeModal(); loadProject(d.path); return }
  if (a === 'recent-del') { e.stopPropagation(); RECENTS = RECENTS.filter((r) => r !== d.path); UI.recentIdx = 0; renderModal(); return }
  if (a === 'np-create') { createProject(); return }
  if (a === 'toast-undo') { const fn = TOAST_UNDO; $('#toast').innerHTML = ''; TOAST_UNDO = null; fn?.(); return }
})
document.addEventListener('dblclick', (e) => {
  const node = e.target.closest('#explorer .node[data-key]')
  if (!node || e.target.closest('.nodebtn,.tw')) return
  const key = node.dataset.key
  if (!/^(pg|ch|arc):/.test(key) || pg(key.slice(3))?.matter) return
  UI.renaming = key
  renderExplorer()
})
document.addEventListener('contextmenu', (e) => {
  const node = e.target.closest('#explorer .node[data-key]')
  const head = e.target.closest('#explorer .sechead')
  if (node && /^(pg|ch|arc):/.test(node.dataset.key)) { e.preventDefault(); openCtx(node, rowItems(node.dataset.key), e) }
  else if (head && head.dataset.sec !== 'book') { e.preventDefault(); openCtx(head, sectionItems(head.dataset.sec), e) }
})

// ---------- drag and drop (explorer) ----------
function clearDropMarks() { $$('.drop-in,.drop-before,.drop-after').forEach((n) => n.classList.remove('drop-in', 'drop-before', 'drop-after')) }
function dropPosition(target, e) {
  const drag = UI.drag
  if (!drag) return null
  const kind = target.dataset.drop
  if (drag.type === 'ch') return kind === 'arc' || kind === 'ch' || (kind === 'sec' && target.dataset.sec === 'ms') ? 'in' : null
  if (kind === 'sec') return ['plot', 'world', 'notes'].includes(target.dataset.sec) ? 'in' : null
  if (kind !== 'pg') return null
  const tp = pg(target.dataset.id)
  if (tp.id === drag.id || descendants(drag.id).some((x) => x.id === tp.id)) return null
  if (tp.matter) return 'in'
  const r = target.getBoundingClientRect(), y = (e.clientY - r.top) / r.height
  return y < 0.28 ? 'before' : y > 0.72 ? 'after' : 'in'
}
document.addEventListener('dragstart', (e) => {
  const n = e.target.closest?.('[data-drag]')
  if (!n) return
  UI.drag = { type: n.dataset.drag, id: n.dataset.id }
  n.classList.add('dragging')
  e.dataTransfer.effectAllowed = 'move'
  e.dataTransfer.setData('text/plain', n.dataset.id)
})
document.addEventListener('dragend', () => { UI.drag = null; clearDropMarks(); $$('.dragging').forEach((n) => n.classList.remove('dragging')) })
document.addEventListener('dragover', (e) => {
  const cover = e.target.closest?.('#coverDrop')
  if (cover && !UI.drag) { e.preventDefault(); cover.classList.add('dragover'); return }
  const t = e.target.closest?.('#explorer [data-drop]')
  if (!t || !UI.drag) return
  const pos = dropPosition(t, e)
  clearDropMarks()
  if (!pos) return
  e.preventDefault()
  t.classList.add('drop-' + pos)
})
document.addEventListener('dragleave', (e) => { const c = e.target.closest?.('#coverDrop'); if (c) c.classList.remove('dragover') })
document.addEventListener('drop', (e) => {
  const cover = e.target.closest?.('#coverDrop')
  if (cover && !UI.drag) { e.preventDefault(); cover.classList.remove('dragover'); readCover(e.dataTransfer.files?.[0]); return }
  const t = e.target.closest?.('#explorer [data-drop]')
  if (!t || !UI.drag) return
  const pos = dropPosition(t, e)
  clearDropMarks()
  if (!pos) return
  e.preventDefault()
  const drag = UI.drag
  UI.drag = null
  if (drag.type === 'ch') {
    const c = chap(drag.id)
    const arcId = t.dataset.drop === 'arc' ? t.dataset.id : t.dataset.drop === 'ch' ? chap(t.dataset.id).arc : null
    c.arc = arcId
    if (arcId) S.open['arc:' + arcId] = true
  } else {
    const p = pg(drag.id)
    S.pages.splice(S.pages.indexOf(p), 1)
    if (t.dataset.drop === 'sec') { p.parent = null; setSection(p, t.dataset.sec); S.pages.push(p) }
    else {
      const tp = pg(t.dataset.id)
      if (pos === 'in') { p.parent = tp.id; setSection(p, tp.section); S.pages.push(p); S.open['pg:' + tp.id] = true }
      else { p.parent = tp.parent; setSection(p, tp.section); S.pages.splice(S.pages.indexOf(tp) + (pos === 'after' ? 1 : 0), 0, p) }
    }
  }
  EDITS++; flashSaving()
  renderExplorer(); renderDoc(); renderDock(); renderCrumbs()
})

// ---------- boot ----------
function initialTheme() {
  const t = document.documentElement.getAttribute('data-theme')
  if (t === 'light') return 'gray-light'
  if (t === 'dark') return 'gray-dark'
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'gray-dark' : 'gray-light'
}
function start(data) {
  UI.theme = initialTheme()
  document.documentElement.setAttribute('data-theme', UI.theme)
  if (window.matchMedia('(max-width:720px)').matches) UI.sidebar = false
  if (data && data.projects && data.path) {
    Object.assign(PROJECTS, data.projects)
    if (data.recents) RECENTS = data.recents
    S = PROJECTS[data.path]
  }
  if (!S) { S = makeSample(); PROJECTS[S.path] = S }
  renderAll()
}
window.claude?.hot?.snapshot?.(() => ({ projects: PROJECTS, path: S?.path, recents: RECENTS }))
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {})
</script>
